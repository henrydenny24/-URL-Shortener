<!DOCTYPE html>
<html>

<head>

    <title>URL Shortener</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🔗 URL Shortener</h1>

        <p>
            Make your long URLs short and simple.
        </p>

        <form method="POST">

            <input
                type="url"
                name="url"
                placeholder="Enter your long URL"
                required
            >

            <button type="submit">
                Shorten URL
            </button>

        </form>

        <div class="result">

            {{SHORT_URL}}

        </div>

    </div>

</body>

</html>
